name: Auto Labeler
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title.toLowerCase();
            const labels = new Set();

            // Match tags/prefixes or keywords in the title
            if (title.startsWith('fix:') || title.includes('bug')) {
              labels.add('bug');
            }
            if (title.startsWith('feat:') || title.includes('feature')) {
              labels.add('enhancement');
            }
            if (title.startsWith('docs:') || title.includes('documentation') || title.includes('readme')) {
              labels.add('documentation');
            }
            if (title.startsWith('perf:') || title.includes('performance') || title.includes('optimize')) {
              labels.add('performance');
            }
            if (title.startsWith('refactor:') || title.includes('clean') || title.includes('refactoring')) {
              labels.add('refactor');
            }
            if (title.includes('accessibility') || title.includes('a11y') || title.includes('aria')) {
              labels.add('accessibility');
            }
            if (title.startsWith('test:') || title.includes('testing') || title.includes('unit-test')) {
              labels.add('testing');
            }
            if (title.startsWith('chore:') || title.startsWith('ci:') || title.includes('workflow')) {
              labels.add('chore');
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: Array.from(labels)
              });
              console.log(`Successfully added labels: ${Array.from(labels).join(', ')}`);
            } else {
              console.log('No matching label categories found in PR title.');
            }
